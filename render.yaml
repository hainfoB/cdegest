# Déploiement gratuit : service web Render (free) + base PostgreSQL Neon (free, sans expiration).
# DATABASE_URL et les PASSWORD_* sont saisis dans le tableau de bord Render (sync: false).
services:
  - type: web
    name: cdegest
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi db upgrade && flask --app wsgi seed-base && flask --app wsgi sync-passwords && gunicorn wsgi:app --worker-class gthread --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "1"
      - key: SHOW_DEMO_ACCOUNTS
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: PASSWORD_MFEP
        sync: false
      - key: PASSWORD_DFEP_BBA
        sync: false
      - key: PASSWORD_COORD_BBA
        sync: false
      - key: PASSWORD_RESP_BBA01
        sync: false
      - key: PASSWORD_ENSEIGNANT_BBA01
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
