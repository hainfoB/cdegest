{% extends "auth/_layout.html" %}
{% block title %}{{ t('login.forgot') }}{% endblock %}
{% block box %}
<h2>{{ t('login.forgot') }}</h2>
{% if sent %}<div class="alert alert-ok">{{ t('forgot.sent') }}</div>{% endif %}
<p class="sub">{{ t('forgot.hint') }}</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field"><label for="nin">{{ t('login.nin') }}</label><input class="input" id="nin" name="nin" inputmode="numeric" dir="ltr" required maxlength="22"></div>
  <button class="btn btn-cde btn-block" type="submit">{{ t('forgot.submit') }}</button>
</form>
<p style="margin-top:14px"><a href="{{ url_for('auth.login') }}">{{ back }} {{ t('login.title') }}</a></p>
{% endblock %}
