{% if not logged %}
<h3 style="margin-top:8px">{{ t('pub.account') }}</h3>
<p class="hint">{{ t('pub.account_hint') }}</p>
<div class="fgrid">
  <div class="field"><label for="pw">{{ t('acc.new') }} *</label><input class="input" type="password" id="pw" name="password" minlength="10" autocomplete="new-password" required dir="ltr"><p class="hint">{{ t('acc.rule') }}</p></div>
  <div class="field"><label for="pw2">{{ t('acc.new2') }} *</label><input class="input" type="password" id="pw2" name="password2" minlength="10" autocomplete="new-password" required dir="ltr"></div>
</div>
{% endif %}
